# Firecracker rules in force in Delhi-NCR on Diwali night.
# regime codes used in the analysis:
#   permissive    crackers widely available and burst (no ban, or a sale-only suspension)
#   green_window  only certified "green" crackers, inside fixed hours
#   full_ban      sale and bursting banned
cracker_rules_delhi:
  - {year: 2016, regime: permissive,   detail: "No restriction in force on Diwali (licences suspended by the Supreme Court on 11 Nov 2016, after the festival)", source: "Arjun Gopal v. Union of India, SC order 11 Nov 2016", verified: false}
  - {year: 2017, regime: permissive,   detail: "Sale suspended in Delhi-NCR; bursting of existing stock not prohibited", source: "Arjun Gopal v. Union of India, SC order 9 Oct 2017", verified: false}
  - {year: 2018, regime: green_window, detail: "Only improved or green crackers, 8-10 pm on Diwali", source: "Arjun Gopal v. Union of India, SC order 23 Oct 2018", verified: false}
  - {year: 2019, regime: green_window, detail: "Green crackers only (CSIR-NEERI), 8-10 pm", source: "SC order 23 Oct 2018 continued", verified: false}
  - {year: 2020, regime: full_ban,     detail: "Sale and use banned in NCR, 9-30 Nov 2020", source: "NGT order 9 Nov 2020 (OA 249/2020)", verified: false}
  - {year: 2021, regime: full_ban,     detail: "Complete ban on sale and bursting in Delhi", source: "DPCC order Sep 2021", verified: false}
  - {year: 2022, regime: full_ban,     detail: "Complete ban on sale and bursting in Delhi until 1 Jan 2023", source: "DPCC order Sep 2022", verified: false}
  - {year: 2023, regime: full_ban,     detail: "Complete ban on sale and bursting in Delhi", source: "DPCC order Sep 2023", verified: false}
  - {year: 2024, regime: full_ban,     detail: "Complete ban on sale and bursting in Delhi until 1 Jan 2025", source: "DPCC order 14 Oct 2024", verified: false}
  - {year: 2025, regime: green_window, detail: "Green crackers allowed 18-21 Oct; bursting 6-7 am and 8-10 pm", source: "Supreme Court order 15 Oct 2025 (reported by Deccan Herald, 2025)", verified: false}
  - {year: 2026, regime: unknown,      detail: "Not announced when the forecast was locked", source: "", verified: true}

# Tamil Nadu sets its own two-hour windows for Deepavali, including early morning.
# Used only as a timing contrast for Chennai in H3.
tamil_nadu_note: "Deepavali crackers are customarily burst at dawn on Naraka Chaturdashi; the state has permitted morning and evening two-hour windows since 2018."

