# Study cities. Stations are matched to a city by distance from its centre.
# region codes:
#   delhi_ncr   receptor region for Parts B and C
#   source      paddy-burning states (Punjab, Haryana, Chandigarh): Part C ground test
#   igp         rest of the Indo-Gangetic Plain
#   rest        cities outside the plain, used as contrasts
# max_stations keeps the download focused on the longest-running monitors.
# met_proxy: use a neighbouring city's weather (same reanalysis grid area) to save API quota.

cities:
