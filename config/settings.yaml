# Study-wide settings. Changing a value here changes every downstream result.

period:
  start: "2016-01-01"   # OpenAQ's India archive begins 30 Jan 2016
  end: "2026-09-30"     # last complete month before the analysis froze

pollutants: [pm25, pm10, no2, so2, co]

openaq:
  api: "https://api.openaq.org/v3"
  archive: "https://openaq-data-archive.s3.amazonaws.com"
  country_id: 9            # India
  min_years: 4             # a station needs at least this many calendar years of files
  max_workers: 48          # parallel downloads from the public S3 archive

firms:
  base: "https://firms.modaps.eosdis.nasa.gov/data/country"
  products: [modis, viirs-snpp]
  years: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
  # north-west India source region: Punjab, Haryana, Delhi, western UP, northern Rajasthan
  bbox: {lat_min: 27.0, lat_max: 32.6, lon_min: 73.5, lon_max: 79.5}

meteo:
  api: "https://archive-api.open-meteo.com/v1/archive"
  hourly: [temperature_2m, relative_humidity_2m, precipitation, surface_pressure,
           wind_speed_10m, wind_direction_10m, boundary_layer_height, cloud_cover,
           shortwave_radiation, dew_point_2m]
  # Open-Meteo free tier: 5,000 weighted calls/hour, 10,000/day.
  # One city, 10 variables, ~11 years ~= 280 weighted calls.
  max_weighted_calls_per_hour: 4500

qc:
  flatline_hours: 6          # identical consecutive values flagged as a stuck sensor
  max_valid: {pm25: 999, pm10: 1500, no2: 500, so2: 500, co: 50000}
  spike_robust_z: 8          # vs a 7-day rolling median/MAD
  min_station_hours_per_day: 18

deweather:
  n_samples: 200             # weather resamples per hour
  seed: 2026
